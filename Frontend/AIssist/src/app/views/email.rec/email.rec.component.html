<div class="overlay"></div>

<div class="modal login-container" role="dialog" aria-modal="true" aria-label="Email ou usuário">
  <h2>AIssist</h2>

  <form class="formulario" [formGroup]="form" (ngSubmit)="email()" autocomplete="off" novalidate>
    <label>
      <span>Email ou usuário</span>
      <input type="email" formControlName="email" placeholder="voce@exemplo.com">
    </label>

    <button class="primary" type="submit">Enviar email de recuperação</button>
        </form>
    <a class="password-recovery-link" href="/login">
     Já tem conta? Faça login
    </a>
